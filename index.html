<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Central da Equipe · Você Rico em Dólar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0B0B0D; --card:#16161A; --card-2:#1D1D23; --ink:#F1EEE6; --soft:#9E998D; --faint:#67625A;
    --line:#2A2A31; --line-2:#202026;
    --gold:#C9A24B; --gold-2:#E6C871; --gold-deep:#8A6A24; --gold-soft:rgba(201,162,75,.13); --gold-line:rgba(201,162,75,.32);
    --green:#46B07C; --green-soft:rgba(70,176,124,.15);
    --red:#D9594C; --red-soft:rgba(217,89,76,.15);
    --blue:#5AA6C9; --blue-soft:rgba(90,166,201,.14);
    --amber:#E2A33C; --amber-soft:rgba(226,163,60,.14);
    --purple:#B98BD6; --purple-soft:rgba(185,139,214,.15);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(1100px 620px at 78% -12%, rgba(201,162,75,.11), transparent 60%),
      radial-gradient(820px 520px at -8% 112%, rgba(201,162,75,.06), transparent 55%),
      var(--bg);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;
  }
  .app{display:block}
  .wrap{max-width:460px;margin:0 auto;min-height:100dvh;position:relative;display:flex;flex-direction:column}
  @media(min-width:560px) and (max-width:979px){
    .wrap{border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(22,22,26,.35)}
  }
  /* logo */
  .globe{flex:none}
  .wm{display:flex;flex-direction:column;line-height:1.05}
  .wm span{font-family:'Sora',sans-serif;font-weight:600;font-size:12px;letter-spacing:.13em;color:#D7D2C6}
  .wm b{font-family:'Sora',sans-serif;font-weight:700;font-size:12px;letter-spacing:.10em;color:#fff}
  .wm b em{font-style:normal;color:var(--gold-2)}
  /* mobile top bar */
  .top{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);
    background:linear-gradient(180deg,rgba(11,11,13,.96),rgba(11,11,13,.74));
    border-bottom:1px solid var(--line);padding:13px 16px 12px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{display:flex;align-items:center;gap:10px}
  .who{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:4px 8px 4px 4px;cursor:pointer}
  .who .av,.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#0B0B0D;font-weight:800;font-size:12px;flex:none}
  .who .nm{font-weight:700;font-size:13px;color:var(--ink)}
  .who .ar{color:var(--gold);font-size:11px}
  /* sidebar (desktop) */
  .sidebar{display:none}
  /* scroll body */
  .scroll{flex:1;overflow-y:auto;padding:18px 16px 110px}
  .pagehead{margin:2px 2px 16px}
  .pagehead .k{font-family:'Hanken Grotesk';font-weight:700;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .pagehead h2{font-family:'Sora',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em;margin-top:5px;line-height:1.05;color:#fff}
  .pagehead p{color:var(--soft);font-size:13.5px;margin-top:6px;line-height:1.45;max-width:60ch}
  /* progress ring */
  .todaybar{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
  .ring{position:relative;width:54px;height:54px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--gold-2)}
  .todaybar .t1{font-weight:800;font-size:15px}
  .todaybar .t2{color:var(--soft);font-size:12.5px;margin-top:2px}
  /* section label */
  .seclab{font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin:20px 4px 10px;display:flex;align-items:center;gap:10px}
  .seclab .ln{height:1px;background:var(--line);flex:1}
  /* task card */
  .task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:15px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);position:relative;transition:.25s}
  .task.done{opacity:.55;background:#121215}
  .task.gone{transform:translateX(8px) scale(.97);opacity:0}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;cursor:pointer;
    display:grid;place-items:center;background:#0F0F12;margin-top:1px;transition:.2s;position:relative}
  .check:hover{border-color:var(--green)}
  .check.on{background:var(--green);border-color:var(--green)}
  .check svg{width:14px;height:14px;stroke:#0B0B0D;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
  .check.on svg{stroke-dashoffset:0}
  .check.pop{animation:pop .42s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.32)}100%{transform:scale(1)}}
  .tk-body{flex:1;min-width:0}
  .tk-title{font-weight:600;font-size:14.5px;line-height:1.3;color:var(--ink)}
  .task.done .tk-title{text-decoration:line-through;color:var(--faint)}
  .tk-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
  .chip.cat-lancamento{background:var(--gold-soft);color:var(--gold-2)}
  .chip.cat-conteudo{background:var(--blue-soft);color:#8CC8E2}
  .chip.cat-comercial{background:var(--green-soft);color:#74D2A4}
  .chip.cat-trafego{background:var(--amber-soft);color:#EBB75E}
  .chip.cat-tecnico{background:var(--purple-soft);color:#CFA8E6}
  .chip.cat-rotina{background:rgba(158,153,141,.13);color:#B7B2A6}
  .chip.due{background:rgba(158,153,141,.12);color:var(--soft)}
  .chip.due.over{background:var(--red-soft);color:#F0897C}
  .chip.who-c{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--line);color:var(--soft)}
  .chip.who-c .dot{width:7px;height:7px;border-radius:50%}
  .chip.rev{background:var(--purple-soft);color:#CFA8E6}
  .chip.recur{background:rgba(158,153,141,.1);color:var(--soft)}
  /* kanban */
  .filterrow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px}
  .filterrow::-webkit-scrollbar{display:none}
  .fbtn{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;
    font-weight:700;font-size:12.5px;color:var(--soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .fbtn .dot{width:8px;height:8px;border-radius:50%}
  .fbtn.on{background:var(--gold);color:#1A1606;border-color:var(--gold)}
  .kcol{margin-bottom:18px;min-height:62px}
  .kc-empty{color:var(--faint);font-size:12px;min-height:54px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center}
  .kcol-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-weight:800;font-size:13px;color:var(--ink)}
  .kcol-h .cnt{background:var(--card-2);color:var(--soft);border-radius:999px;font-size:11px;padding:1px 8px}
  .kcol-h .pip{width:9px;height:9px;border-radius:3px}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab;touch-action:pan-y}
  .kcard:active{cursor:grabbing}
  .kcard.dragging{opacity:.32}
  .drag-clone{position:fixed;z-index:9999;pointer-events:none;opacity:.95;transform:rotate(1.4deg);box-shadow:0 14px 34px rgba(0,0,0,.55);margin:0}
  .kcol.dragover{background:rgba(201,162,75,.10);border-radius:14px;outline:2px dashed var(--gold-line);outline-offset:-3px}
  .kcard .tk-title{font-size:13.5px}
  .kc-act{display:flex;gap:7px;margin-top:11px}
  .draghint{font-size:12px;color:var(--faint);margin:0 2px 11px}
  .scopetg{margin-bottom:9px}
  /* pipeline: espaçamento + editar etapas */
  .pipehint{margin-bottom:12px}
  .pipetools{margin-bottom:18px}
  .editstages{background:#16161A;border:1px solid var(--line);color:var(--soft);border-radius:10px;padding:9px 14px;font-weight:700;font-size:12.5px;cursor:pointer}
  .editstages:hover{border-color:var(--gold-line);color:var(--gold-2)}
  .stageedit{display:flex;flex-direction:column;gap:11px;margin-bottom:10px}
  .strow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .strow .sl{flex:1 1 100%;border:1px solid var(--line);background:#0F0F12;border-radius:9px;padding:9px 10px;font-size:13.5px;color:var(--ink);font-family:inherit}
  .strow .sl:focus{outline:none;border-color:var(--gold-line)}
  .scolors{display:flex;gap:4px;flex:1 1 auto;align-items:center}
  .scolors .sc{width:17px;height:17px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .scolors .sc.on{border-color:#fff}
  .smv{flex:none;width:30px;height:30px;border:1px solid var(--line);background:#0F0F12;color:var(--soft);border-radius:8px;cursor:pointer;font-size:13px}
  .smv:hover{border-color:var(--gold-line);color:var(--ink)}
  .smv.sdel:hover{border-color:#D9594C;color:#E98B80}
  .mini{flex:1;border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:7px;font-weight:700;font-size:12px;
    color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
  .mini:hover{background:#26262d}
  .mini.go{background:var(--green);color:#08120C;border-color:var(--green)}
  .mini.back{flex:none;width:38px;color:var(--soft)}
  /* agenda */
  .daygroup{margin-bottom:6px}
  .dayhd{font-weight:800;font-size:13px;margin:18px 4px 10px;display:flex;align-items:baseline;gap:8px;color:var(--ink)}
  .dayhd .dd{color:var(--faint);font-weight:700;font-size:11.5px}
  /* painel */
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
  .pcard.big{background:linear-gradient(150deg,#1E1B14 0%,#15140F 55%,#14130E 100%);border:1px solid var(--gold-line);position:relative;overflow:hidden}
  .pcard.big:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,75,.18),transparent 70%)}
  .pcard.big .lab{color:var(--gold);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .pcard.big .big-n{font-family:'Sora',sans-serif;font-size:42px;font-weight:700;line-height:1;color:#fff;margin-top:2px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;position:relative}
  .pgrid .b{background:rgba(201,162,75,.08);border:1px solid var(--gold-line);border-radius:12px;padding:10px 8px;text-align:center}
  .pgrid .b .n{font-weight:800;font-size:19px;color:var(--gold-2)}
  .pgrid .b .l{font-size:10px;color:var(--soft);margin-top:2px;letter-spacing:.03em}
  .prow{display:flex;align-items:center;gap:12px}
  .prow .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#0B0B0D;font-weight:800;font-size:14px;flex:none}
  .prow .pn{font-weight:700;font-size:14px}
  .prow .pr{color:var(--soft);font-size:11.5px;margin-top:1px}
  .prow .stat{margin-left:auto;text-align:right}
  .prow .stat .s1{font-weight:800;font-size:14px}
  .prow .stat .s2{font-size:10.5px;color:var(--faint)}
  .pbar{height:7px;border-radius:99px;background:var(--line-2);margin-top:12px;overflow:hidden}
  .pbar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .6s}
  .blocked{margin-top:11px;background:var(--red-soft);border-radius:10px;padding:8px 11px;font-size:12.5px;color:#F0897C;display:flex;gap:7px}
  .blocked b{font-weight:800}
  /* guia */
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .gcard h3{font-family:'Sora',sans-serif;font-weight:600;font-size:17px;margin-bottom:5px;display:flex;align-items:center;gap:9px;color:#fff}
  .gcard h3 .em{font-size:18px}
  .gcard p.sub{color:var(--soft);font-size:12.5px;margin-bottom:12px}
  .rolelist .r{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line-2)}
  .rolelist .r:first-child{border-top:none}
  .rolelist .av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#0B0B0D;font-weight:800;font-size:13px;flex:none}
  .rolelist .rn{font-weight:700;font-size:14px}
  .rolelist .rr{color:var(--soft);font-size:12px;margin-top:1px;line-height:1.4}
  .rolelist .tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:4px}
  .dod li,.gen li{list-style:none;padding:9px 0 9px 28px;position:relative;font-size:13.5px;line-height:1.45;border-top:1px solid var(--line-2)}
  .dod li:first-child,.gen li:first-child{border-top:none}
  .dod li:before{content:"";position:absolute;left:2px;top:12px;width:15px;height:15px;border-radius:5px;border:2px solid var(--green);background:var(--green-soft)}
  .dod li:after{content:"✓";position:absolute;left:4.5px;top:8px;color:var(--green);font-weight:900;font-size:11px}
  .gen li:before{content:"›";position:absolute;left:6px;top:7px;color:var(--gold);font-weight:900;font-size:16px}
  .access{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .access span{font-size:12px;font-weight:600;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--soft)}
  .note{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#E0C892;line-height:1.5;margin-top:12px;margin-bottom:4px}
  .note b{font-weight:800;color:var(--gold-2)}
  .ghost{width:100%;border:1px dashed var(--line);background:transparent;border-radius:11px;padding:12px;
    font-weight:700;font-size:12.5px;color:var(--soft);cursor:pointer;margin-top:8px}
  .ghost:hover{border-color:var(--gold-line);color:var(--gold-2)}
  /* empty */
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}
  .empty .e{font-size:34px;margin-bottom:10px}
  .empty .h{font-weight:800;font-size:15px;color:var(--ink)}
  .empty .s{font-size:13px;margin-top:4px}
  /* FAB */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:35;
    background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1A1606;border:none;border-radius:999px;padding:13px 20px;font-weight:800;font-size:14px;
    box-shadow:0 12px 26px -8px rgba(201,162,75,.5);cursor:pointer;display:flex;align-items:center;gap:8px}
  .fab svg{stroke:#1A1606}
  @media(min-width:560px){.fab{left:auto;right:max(calc(50% - 230px + 16px),16px);transform:none}}
  /* bottom nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:40;
    display:grid;grid-template-columns:repeat(6,1fr);background:rgba(12,12,14,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
  .nav button{position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--faint);font-weight:700;font-size:9.5px;padding:5px 0;transition:.15s}
  .nav button svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .nav button.on{color:var(--gold-2)}
  .nav button .badge{position:absolute;top:-1px;left:calc(50% + 5px);background:var(--gold);color:#1A1606;font-size:9px;font-weight:800;
    border-radius:99px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px}
  .navwrap{position:relative}
  /* sheet / modal */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;opacity:0;pointer-events:none;transition:.22s}
  .ovl.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:460px;z-index:61;
    background:var(--card-2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -16px 48px -12px rgba(0,0,0,.7);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-height:88dvh;overflow-y:auto}
  .sheet.show{transform:translateX(-50%) translateY(0)}
  @media(min-width:560px){.sheet{border-radius:20px;bottom:auto;top:50%;transform:translateX(-50%) translateY(-40%) scale(.98);max-width:440px;opacity:0}
    .sheet.show{transform:translateX(-50%) translateY(-50%) scale(1);opacity:1}}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 14px}
  @media(min-width:560px){.grab{display:none}}
  .sheet h3{font-family:'Sora',sans-serif;font-weight:600;font-size:20px;margin-bottom:3px;color:#fff;margin-top:6px}
  .sheet .sub{color:var(--soft);font-size:13px;margin-bottom:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-weight:700;font-size:12px;color:var(--soft);margin-bottom:6px;letter-spacing:.02em}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0F0F12;border-radius:11px;
    padding:12px;font-family:inherit;font-size:14.5px;color:var(--ink)}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold-line)}
  .field textarea{min-height:74px;resize:vertical}
  /* campos personalizados */
  .campo{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .campo .campo-n{flex:0 0 38%;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:700;color:var(--soft);font-family:inherit}
  .campo .campo-n:hover{background:#0F0F12}
  .campo .campo-n:focus{outline:none;border-color:var(--gold-line);background:#0F0F12;color:var(--ink)}
  .campo .campo-v{flex:1;border:1px solid var(--line);background:#0F0F12;border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink);font-family:inherit}
  .campo .campo-v:focus{outline:none;border-color:var(--gold-line)}
  .campo .campo-x{flex:none;background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;padding:4px 5px;line-height:1}
  .campo .campo-x:hover{color:#E08C8C}
  .addfield{background:none;border:1px dashed var(--line);color:var(--gold-2);border-radius:9px;padding:9px;font-weight:700;font-size:12px;cursor:pointer;width:100%;margin-top:4px}
  .addfield:hover{border-color:var(--gold-line)}
  /* comentários */
  .cmt{display:flex;gap:9px;margin-bottom:11px}
  .cmt .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#0B0B0D;font-weight:800;font-size:12px;flex:none}
  .cmt-b{flex:1;min-width:0}
  .cmt-h{font-size:12px;font-weight:700;color:var(--ink)}
  .cmt-h span{color:var(--faint);font-weight:500;font-size:11px;margin-left:5px}
  .cmt-t{font-size:13px;color:var(--soft);margin-top:2px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .cmt-add{display:flex;gap:7px;margin-top:6px}
  .cmt-add input{flex:1;border:1px solid var(--line);background:#0F0F12;border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink);font-family:inherit}
  .cmt-add input:focus{outline:none;border-color:var(--gold-line)}
  .cmt-add button{background:var(--gold);color:#1A1606;border:none;border-radius:10px;padding:0 15px;font-weight:800;font-size:13px;cursor:pointer;flex:none}
  /* subtarefas */
  .subcount{color:var(--gold-2);font-weight:800;margin-left:4px}
  .subrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .subck{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:#0F0F12;color:#0B0B0D;font-size:12px;font-weight:900;cursor:pointer;display:grid;place-items:center}
  .subck.on{background:var(--green);border-color:var(--green)}
  .subtx{flex:1;border:1px solid var(--line);background:#0F0F12;border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink);font-family:inherit}
  .subtx.done{text-decoration:line-through;color:var(--faint)}
  .subtx:focus{outline:none;border-color:var(--gold-line)}
  .subx{flex:none;background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;padding:4px 5px;line-height:1}
  .subx:hover{color:#E08C8C}
  /* anexos & links */
  .linkrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;background:#0F0F12;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .linkrow .lkico{flex:none;font-size:13px}
  .linkrow .lkname{flex:1;color:var(--gold-2);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .linkrow .lkname:hover{text-decoration:underline}
  .linkadd{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .linkadd input{flex:1;min-width:120px;border:1px solid var(--line);background:#0F0F12;border-radius:9px;padding:9px 10px;font-size:13px;color:var(--ink);font-family:inherit}
  .linkadd input:focus{outline:none;border-color:var(--gold-line)}
  .linkadd button{flex:none;background:var(--gold-soft);color:var(--gold-2);border:1px solid var(--gold-line);border-radius:9px;padding:0 14px;font-weight:800;font-size:12.5px;cursor:pointer}
  .chip.sub{background:rgba(70,176,124,.14);color:#7FD3A6}
  .chip.lk{background:rgba(90,166,201,.14);color:#8CC8E2}
  /* fila de aprovação (Simoni) */
  .task.appr{flex-wrap:wrap;border-color:var(--gold-line)}
  .appr-acts{display:flex;gap:7px;width:100%;margin-top:9px}
  .appr-acts .mini{flex:1}
  /* carga da equipe */
  .loadwrap{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
  .loadrow{display:flex;align-items:center;gap:10px}
  .loadrow .lu{display:flex;align-items:center;gap:7px;width:96px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink)}
  .loadrow .lu .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#0B0B0D;font-weight:800;font-size:11px}
  .loadrow .lbar{flex:1;height:9px;background:#1A1A1F;border-radius:99px;overflow:hidden}
  .loadrow .lbar i{display:block;height:100%;border-radius:99px;transition:width .3s}
  .loadrow .lcount{width:118px;flex:none;text-align:right;font-size:11px;color:var(--soft)}
  /* resumo p/ whatsapp */
  .rsum{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
  .rsum-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
  .rsum-n{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;color:var(--ink)}
  .rsum-n .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#0B0B0D;font-weight:800;font-size:11px}
  .rsum-cp{background:var(--gold-soft);color:var(--gold-2);border:1px solid var(--gold-line);border-radius:9px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;flex:none}
  .rsum-t{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:12.5px;line-height:1.5;color:var(--soft);background:#0F0F12;border:1px solid var(--line);border-radius:10px;padding:11px;margin:0}
  /* financeiro + pessoal (privado) */
  .perstextarea{width:100%;border:1px solid var(--line);background:#0F0F12;border-radius:12px;padding:12px;font-family:inherit;font-size:14px;color:var(--ink);min-height:110px;resize:vertical;margin-bottom:10px}
  .perstextarea:focus{outline:none;border-color:var(--gold-line)}
  .finrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
  .finrow:hover{border-color:var(--gold-line)}
  .finb{flex:1;min-width:0}
  .fintitle{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:7px}
  .finval{flex:none;font-weight:800;font-size:14.5px;white-space:nowrap}
  .finright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
  /* financeiro rico */
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;max-width:860px}
  .fcard-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px;color:var(--ink);margin-bottom:11px}
  .fmeta-edit{background:none;border:1px solid var(--line);color:var(--gold-2);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
  .fmeta-edit:hover{border-color:var(--gold-line)}
  .fbar{flex:1;height:12px;background:#1A1A1F;border-radius:99px;overflow:hidden}
  .fbar i{display:block;height:100%;border-radius:99px}
  .fbar-row{display:flex;align-items:center;gap:12px}
  .fbar-v{flex:none;font-weight:800;font-size:13px;color:var(--ink)}
  .fbar-v span{color:var(--soft);font-weight:600}
  .fmeta-pct{font-size:11.5px;color:var(--soft);margin-top:8px}
  .fcatwrap,.fmonwrap{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;max-width:860px}
  .fcatrow{display:flex;align-items:center;gap:10px}
  .fcatrow .fcn{width:104px;flex:none;font-size:12.5px;font-weight:600;color:var(--ink)}
  .fcatrow .fcv{width:140px;flex:none;text-align:right;font-size:12px;color:var(--soft)}
  .fcatrow .fcv span{color:var(--faint);margin-left:4px}
  .fmonrow{display:flex;align-items:center;gap:12px}
  .fmonrow .fmn{width:54px;flex:none;font-size:12px;font-weight:700;color:var(--soft)}
  .fmbars{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .fmb{display:flex;align-items:center;gap:9px}
  .fmb .fmtrack{flex:1;height:9px;background:#1A1A1F;border-radius:99px;overflow:hidden;min-width:0}
  .fmb .fmtrack i{display:block;height:100%;border-radius:99px;min-width:2px}
  .fmb span{flex:none;width:96px;text-align:right;font-size:11px;color:var(--soft)}
  .flegend{display:flex;gap:18px;margin:4px 2px 14px;font-size:11.5px;color:var(--soft)}
  .flegend .lg{display:flex;align-items:center;gap:6px}
  .flegend .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  /* biblioteca de aulas (Depoimentos) */
  .aula{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);max-width:860px}
  .aula:hover{border-color:var(--gold-line)}
  .aula-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .aula-n{font-weight:800;font-size:15px;color:var(--ink)}
  .aula-d{font-size:12px;color:var(--soft);margin-top:2px}
  .aula-rec{flex:none;background:var(--gold-soft);color:var(--gold-2);border:1px solid var(--gold-line);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;text-decoration:none}
  .aula-docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .aula-doc{background:#0F0F12;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--soft);text-decoration:none}
  .aula-doc:hover{color:var(--gold-2);border-color:var(--gold-line)}
  .aula-csec{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:13px 0 7px}
  .aula-cortes{display:flex;flex-direction:column;gap:5px}
  .aula-corte{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
  .aula-corte .cdot{width:7px;height:7px;border-radius:50%;flex:none}
  .aula-corte .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aula-corte .cst{font-size:11px;font-weight:700;flex:none;text-transform:capitalize}
  .aula-corte .clink{flex:none;font-size:11px;color:var(--gold-2);text-decoration:none;font-weight:700}
  .aula-empty{font-size:12px;color:var(--faint)}
  .corte{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:7px}
  .corte .corte-n{flex:1 1 100%;border:1px solid var(--line);background:#0F0F12;border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink);font-family:inherit}
  .corte .corte-n:focus,.corte .corte-u:focus{outline:none;border-color:var(--gold-line)}
  .corte .corte-st{flex:none;border:1px solid;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;cursor:pointer;text-transform:capitalize}
  .corte .corte-u{flex:1;min-width:90px;border:1px solid var(--line);background:#0F0F12;border-radius:9px;padding:7px 9px;font-size:12px;color:var(--ink);font-family:inherit}
  .seg{display:flex;flex-wrap:wrap;gap:7px}
  .seg button{border:1px solid var(--line);background:#0F0F12;border-radius:999px;padding:8px 13px;font-weight:700;font-size:12.5px;
    color:var(--soft);cursor:pointer}
  .seg button.on{background:var(--gold);color:#1A1606;border-color:var(--gold)}
  .toggle{display:flex;align-items:center;gap:10px;background:#0F0F12;border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
  .toggle .sw{width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
  .toggle .sw i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .toggle.on .sw{background:var(--gold)}
  .toggle.on .sw i{left:19.5px}
  .toggle .tx{font-weight:700;font-size:13px}
  .toggle .tx small{display:block;font-weight:500;color:var(--soft);font-size:11.5px}
  .primary{width:100%;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1A1606;border:none;border-radius:13px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px}
  .danger{width:100%;background:transparent;color:#F0897C;border:1px solid rgba(217,89,76,.4);border-radius:13px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:8px}
  .userpick{display:flex;flex-direction:column;gap:7px}
  .userpick button{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:#0F0F12;border-radius:13px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink)}
  .userpick button.on{border-color:var(--gold-line);background:var(--gold-soft)}
  .userpick .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#0B0B0D;font-weight:800;flex:none}
  .userpick .un{font-weight:700;font-size:14px}
  .userpick .ur{font-size:11.5px;color:var(--soft)}
  .sheet .det-meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
  /* view toggle */
  .vtoggle{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px}
  .vtoggle button{border:none;background:none;color:var(--soft);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:8px;cursor:pointer}
  .vtoggle button.on{background:var(--gold);color:#1A1606}
  /* linha de controle com rótulo */
  .ctrlrow{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
  .ctrllabel{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);flex:none;width:52px;padding-top:11px}
  .ctrlrow .filterrow{flex:1;min-width:0;padding-bottom:0;margin:0}
  .ctrlrow .subtabs{flex:1;min-width:0;margin:0;padding-bottom:0}
  .ctrlrow .vtoggle{margin-bottom:0}
  .chips-sm .subtab{padding:6px 12px;font-size:12px}
  /* sub-tabs */
  .subtabs{display:flex;gap:7px;overflow-x:auto;margin:0 -2px 16px;padding:2px}
  .subtabs::-webkit-scrollbar{display:none}
  .subtab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13px;cursor:pointer}
  .subtab.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-2)}
  .chip.req{background:var(--gold-soft);color:var(--gold-2)}
  .chip.dep2{background:var(--amber-soft);color:#EBB75E}
  .task.dep{border-left:3px solid var(--gold)}
  .dep-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#0B0B0D;font-weight:800;font-size:13px;flex:none;margin-top:1px}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head .mn{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;text-transform:capitalize;color:#fff}
  .cal-navg{display:flex;gap:6px}
  .cal-nav{width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;font-size:15px;font-weight:700;cursor:pointer}
  .cal-nav:hover{border-color:var(--gold-line);color:var(--gold-2)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-wd{font-size:10px;font-weight:700;color:var(--faint);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
  .cal-cell{min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 5px 6px;overflow:hidden}
  .cal-cell.out{background:transparent;border-color:transparent}
  .cal-cell.today{border-color:var(--gold-line);background:var(--gold-soft)}
  .cal-cell .dn{font-size:11px;font-weight:700;color:var(--soft);margin-bottom:3px}
  .cal-cell.today .dn{color:var(--gold-2)}
  .cal-ev{font-size:9.5px;font-weight:600;line-height:1.25;padding:2px 5px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cal-more{font-size:9px;color:var(--faint);font-weight:700;padding-left:2px}
  /* docs + info cards */
  .doc{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:9px;text-decoration:none;box-shadow:var(--shadow)}
  .doc:hover{border-color:var(--gold-line)}
  .doc h4{font-size:14px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .doc h4 span{color:var(--gold-2);font-size:11.5px;font-weight:700;white-space:nowrap}
  .doc p{font-size:12.5px;color:var(--soft);margin-top:4px;line-height:1.4}
  .infocard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:9px;box-shadow:var(--shadow)}
  .infocard h4{font-size:14px;font-weight:700;color:#fff;margin-bottom:7px}
  .infocard ul{list-style:none}
  .infocard li{font-size:12.5px;color:var(--soft);padding:3px 0 3px 16px;position:relative;line-height:1.4}
  .infocard li:before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  /* pipeline ClickUp (rolagem horizontal) */
  .kboard.pipe{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin:0 -2px}
  .kboard.pipe::-webkit-scrollbar{height:8px}
  .kboard.pipe::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  .kboard.pipe .kcol{flex:none;width:215px;margin-bottom:0}
  /* hub vrd */
  .kpigrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .kpi.gold{border-color:var(--gold-line);background:linear-gradient(150deg,#1E1B14,#15140F)}
  .kpi .kl{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);line-height:1.3}
  .kpi .kn{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:#fff;margin-top:7px;line-height:1}
  .kpi .ks{font-size:10px;color:var(--soft);margin-top:5px}
  .hubcols{display:grid;grid-template-columns:1fr;gap:12px;margin-top:4px}
  .hubcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow)}
  .hubh{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;color:#fff;margin-bottom:6px}
  .hubh span{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .saler{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
  .saler:first-of-type{border-top:none}
  .saler .sp{font-size:13px;font-weight:700;color:var(--ink)}
  .saler .se{font-size:11px;color:var(--soft);margin-top:2px;word-break:break-all}
  .saler .sr{text-align:right;white-space:nowrap}
  .saler .sv{font-size:13px;font-weight:800;color:var(--green)}
  .saler .sd{font-size:10.5px;color:var(--faint);margin-top:2px}
  .badge-pago{font-size:9px;font-weight:800;background:var(--green-soft);color:#74D2A4;border-radius:99px;padding:2px 7px;vertical-align:middle;white-space:nowrap}
  .evr{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line-2);font-size:12.5px}
  .evr:first-of-type{border-top:none}
  .evdot{width:7px;height:7px;border-radius:50%;flex:none}
  .evt{font-family:ui-monospace,monospace;color:var(--soft);flex:1}
  .evts{color:var(--faint);font-size:11px}
  .tg{font-size:9.5px;font-weight:800;border-radius:99px;padding:2px 7px;letter-spacing:.02em;white-space:nowrap;display:inline-block}
  .tg-g{background:var(--green-soft);color:#74D2A4}
  .tg-a{background:var(--amber-soft);color:#EBB75E}
  .tg-r{background:var(--red-soft);color:#F0897C}
  .tg-n{background:rgba(158,153,141,.13);color:var(--soft)}
  .tg-b{background:var(--blue-soft);color:#8CC8E2}
  .htbl{overflow-x:auto;margin-top:2px}
  .htbl::-webkit-scrollbar{height:8px}
  .htbl::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  .htbl table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:540px}
  .htbl th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .htbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);color:var(--ink);white-space:nowrap}
  .htbl th.r,.htbl td.r{text-align:right}
  .htbl tbody tr:last-child td{border-bottom:none}
  .hubtotals{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .prodgrid{display:grid;grid-template-columns:1fr;gap:9px}
  .prodcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow)}
  .prodcard .pn2{font-weight:700;font-size:13.5px;color:var(--ink)}
  .prodcard .ptags{display:flex;gap:6px;margin-top:8px}
  @media(min-width:560px){.kpigrid{grid-template-columns:repeat(3,1fr)}.prodgrid{grid-template-columns:1fr 1fr}}
  @media(min-width:980px){.prodgrid{grid-template-columns:1fr 1fr 1fr}}
  .chip.prio-alta{background:var(--red-soft);color:#F0897C}
  .chip.prio-media{background:var(--amber-soft);color:#EBB75E}
  .chip.prio-baixa{background:rgba(158,153,141,.13);color:var(--soft)}

const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

function dueLabel(d){
  if(!d)return null;const to=todayISO();
  const diff=Math.round((new Date(d)-new Date(to))/864e5);
  if(diff<0)return {t:Math.abs(diff)+'d atrasada',over:true};
  if(diff===0)return {t:'hoje',over:false};
  if(diff===1)return {t:'amanhã',over:false};
  if(diff<7)return {t:'em '+diff+'d',over:false};
  const dd=new Date(d);return {t:dd.getDate()+'/'+(dd.getMonth()+1),over:false};
}
function metaChips(tk,showOwner){

  if(showOwner){const u=U(tk.owner);h+=`<span class="chip who-c"><span class="dot" style="background:${u.color}"></span>${u.name}</span>`}
  const dl=dueLabel(tk.due);if(dl)h+=`<span class="chip due ${dl.over?'over':''}">${dl.t}</span>`;
  if(tk.dep)h+=`<span class="chip dep2">⏳ depende de ${U(tk.dep).name}</span>`;
  if(tk.subs&&tk.subs.length){const d=tk.subs.filter(s=>s.done).length;h+=`<span class="chip sub">☑ ${d}/${tk.subs.length}</span>`}
  if(tk.links&&tk.links.length)h+=`<span class="chip lk">🔗 ${tk.links.length}</span>`;

  return h;
}

function catColor(cat){return {lancamento:'#E6C871',comercial:'#74D2A4',conteudo:'#8CC8E2',trafego:'#EBB75E',tecnico:'#CFA8E6',rotina:'#B7B2A6'}[cat]||'#B7B2A6'}

/* ---- arrastar card (mouse no desktop · toque-e-segura no celular) + auto-scroll ---- */
function enableCardDrag(card,kind,item){
  let pid=null,sx=0,sy=0,hold=null,active=false,clone=null,offX=0,offY=0,lastCol=null,isTouch=false,raf=null,px=0,py=0;
  const clearHold=()=>{if(hold){clearTimeout(hold);hold=null}};
  function setDragover(){
    const u=document.elementFromPoint(px,py),col=u?u.closest('.kcol'):null;
    if(col!==lastCol){if(lastCol)lastCol.classList.remove('dragover');lastCol=col;if(col)col.classList.add('dragover')}
  }
  function autoScroll(){
    if(!active){raf=null;return}
    const m=56,sp=17,h=window.innerHeight;
    if(py<m)window.scrollBy(0,-sp); else if(py>h-m)window.scrollBy(0,sp);
    const board=card.closest('.kboard');
    if(board&&board.scrollWidth>board.clientWidth+4){
      const br=board.getBoundingClientRect();
      if(px<br.left+m)board.scrollLeft-=sp; else if(px>br.right-m)board.scrollLeft+=sp;
    }
    setDragover();
    raf=requestAnimationFrame(autoScroll);
  }
  function begin(x,y){
    active=true;const r=card.getBoundingClientRect();offX=x-r.left;offY=y-r.top;px=x;py=y;
    clone=card.cloneNode(true);clone.classList.add('drag-clone');
    clone.style.width=r.width+'px';clone.style.left=(x-offX)+'px';clone.style.top=(y-offY)+'px';
    document.body.appendChild(clone);card.classList.add('dragging');
    try{card.setPointerCapture(pid)}catch(_){}
    if(!raf)raf=requestAnimationFrame(autoScroll);
  }
  function moveClone(x,y){px=x;py=y;clone.style.left=(x-offX)+'px';clone.style.top=(y-offY)+'px';setDragover()}
  function onMove(e){
    if(!active){
      const moved=Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6;
      if(isTouch){if(moved)clearHold();return}
      if(!moved)return;begin(e.clientX,e.clientY);
    }
    e.preventDefault();moveClone(e.clientX,e.clientY);
  }
  function onUp(){
    clearHold();
    if(raf){cancelAnimationFrame(raf);raf=null}
    card.removeEventListener('pointermove',onMove);card.removeEventListener('pointerup',onUp);card.removeEventListener('pointercancel',onUp);
    if(!active)return;active=false;
    if(clone){clone.remove();clone=null}
    card.classList.remove('dragging');
    const col=lastCol;if(lastCol){lastCol.classList.remove('dragover');lastCol=null}
    if(col&&col.dataset.drop){kind==='task'?dropTaskTo(item,col.dataset.drop):dropLeadTo(item,col.dataset.drop)}
  }
  card.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,a'))return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;isTouch=e.pointerType==='touch';active=false;
    if(isTouch)hold=setTimeout(()=>{hold=null;begin(sx,sy)},220);
    card.addEventListener('pointermove',onMove);card.addEventListener('pointerup',onUp);card.addEventListener('pointercancel',onUp);
  });
}

const CORTE_COL={'a fazer':'#9E998D','editando':'#E2A33C','pronto':'#46B07C','publicado':'#5AA6C9'};

let aulaEd;

    <div class="field"><label>Cortes / depoimentos</label><div class="cortes">${cortes}</div><button class="addfield" id="auCorteAdd">+ adicionar corte</button></div>
    <button class="primary" id="auSave">Pronto</button>

  sheet.querySelectorAll('.corte-u').forEach(inp=>inp.onchange=()=>{a.cortes[+inp.dataset.ci].url=inp.value;save()});
  sheet.querySelectorAll('.corte-st').forEach(b=>b.onclick=()=>{const c=a.cortes[+b.dataset.ci];const i=STORD.indexOf(c.status||'a fazer');c.status=STORD[(i+1)%STORD.length];save();drawAula()});

function hubTableCard(title,sub,cols,rows){

function nowLabel(){const d=new Date();return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function camposHTML(obj){
  obj.campos=obj.campos||[];

  obj.campos.forEach((c,i)=>{h+=`<div class="campo"><input class="campo-n" data-ci="${i}" value="${esc(c.n)}" placeholder="Nome do campo"><input class="campo-v" data-ci="${i}" value="${esc(c.v||'')}" placeholder="—"><button class="campo-x" data-ci="${i}" title="Remover campo">✕</button></div>`});
  h+='<button class="addfield" id="addCampo">+ adicionar campo</button></div>';
  return h;
}
function commentsHTML(obj){
  obj.comments=obj.comments||[];
  let h='<div class="field"><label>Comentários</label>';
  if(obj.comments.length){obj.comments.forEach(c=>{const u=U(c.u);h+=`<div class="cmt"><span class="av" style="background:${u.color}">${esc(u.name[0])}</span><div class="cmt-b"><div class="cmt-h">${u.name} <span>${c.d}</span></div><div class="cmt-t">${esc(c.t)}</div></div></div>`})}
  else{h+='<div style="color:var(--faint);font-size:12.5px;padding:0 0 6px">Sem comentários ainda.</div>'}
  h+='<div class="cmt-add"><input id="cmtIn" placeholder="Escreva um comentário..."><button id="cmtBtn">Comentar</button></div></div>';
  return h;
}
function wireCC(obj,reopen){
  obj.campos=obj.campos||[];
  sheet.querySelectorAll('.campo-n').forEach(inp=>inp.onchange=()=>{obj.campos[inp.dataset.ci].n=inp.value;save()});
  sheet.querySelectorAll('.campo-v').forEach(inp=>inp.onchange=()=>{obj.campos[inp.dataset.ci].v=inp.value;save()});
  sheet.querySelectorAll('.campo-x').forEach(b=>b.onclick=()=>{obj.campos.splice(+b.dataset.ci,1);save();reopen()});
  const ac=sheet.querySelector('#addCampo');if(ac)ac.onclick=()=>{obj.campos.push({n:'',v:''});save();reopen();const ins=sheet.querySelectorAll('.campo-n');if(ins.length)ins[ins.length-1].focus()};
  const btn=sheet.querySelector('#cmtBtn'),inp=sheet.querySelector('#cmtIn');
  if(btn)btn.onclick=()=>{const t=inp.value.trim();if(!t)return;obj.comments=obj.comments||[];obj.comments.push({u:S.current,t:t,d:nowLabel()});save();reopen()};
}
// subtarefas + anexos/links (estilo ClickUp)
function subsHTML(obj){
  obj.subs=obj.subs||[];
  const done=obj.subs.filter(s=>s.done).length;
  let h='<div class="field"><label>Subtarefas'+(obj.subs.length?` <span class="subcount">${done}/${obj.subs.length}</span>`:'')+'</label>';
  obj.subs.forEach((s,i)=>{h+=`<div class="subrow"><button class="subck${s.done?' on':''}" data-si="${i}">${s.done?'✓':''}</button><input class="subtx${s.done?' done':''}" data-si="${i}" value="${esc(s.t)}" placeholder="Subtarefa..."><button class="subx" data-si="${i}" title="Remover">✕</button></div>`});
  h+='<button class="addfield" id="addSub">+ adicionar subtarefa</button></div>';
  return h;
}
function linksHTML(obj){
  obj.links=obj.links||[];
  let h='<div class="field"><label>Anexos & links</label>';
  obj.links.forEach((l,i)=>{h+=`<div class="linkrow"><span class="lkico">🔗</span><a href="${esc(l.url)}" target="_blank" rel="noopener" class="lkname">${esc(l.name||l.url||'link')}</a><button class="subx" data-li="${i}" title="Remover">✕</button></div>`});
  h+='<div class="linkadd"><input id="lkName" placeholder="Nome (ex.: Briefing, Arte no Drive)"><input id="lkUrl" placeholder="Cole o link / URL do documento"><button id="addLink">Anexar</button></div></div>';
  return h;
}
function wireSubsLinks(obj,reopen){
  obj.subs=obj.subs||[];obj.links=obj.links||[];
  sheet.querySelectorAll('.subck').forEach(b=>b.onclick=()=>{obj.subs[b.dataset.si].done=!obj.subs[b.dataset.si].done;save();reopen()});
  sheet.querySelectorAll('.subtx').forEach(inp=>inp.onchange=()=>{obj.subs[inp.dataset.si].t=inp.value;save()});
  sheet.querySelectorAll('.subx[data-si]').forEach(b=>b.onclick=()=>{obj.subs.splice(+b.dataset.si,1);save();reopen()});
  const as=sheet.querySelector('#addSub');if(as)as.onclick=()=>{obj.subs.push({t:'',done:false});save();reopen();const ins=sheet.querySelectorAll('.subtx');if(ins.length)ins[ins.length-1].focus()};
  sheet.querySelectorAll('.subx[data-li]').forEach(b=>b.onclick=()=>{obj.links.splice(+b.dataset.li,1);save();reopen()});
  const al=sheet.querySelector('#addLink');if(al)al.onclick=()=>{const u=sheet.querySelector('#lkUrl').value.trim();if(!u)return;const n=sheet.querySelector('#lkName').value.trim();obj.links.push({name:n||u,url:u});save();reopen()};
}

    <div class="field"><label>Responsável</label><select id="tOwner">${USERS.map(u=>`<option value="${u.id}" ${u.id===tk.owner?'selected':''}>${u.name} · ${u.role}</option>`).join('')}</select></div>
    <div class="field"><label>Prioridade</label><div class="seg" id="tPrio"><button data-p="" class="${!tk.prio?'on':''}">—</button>${Object.keys(PRIOS).map(p=>`<button data-p="${p}" class="${tk.prio===p?'on':''}">${PRIOS[p].l}</button>`).join('')}</div></div>
    ${tk.review?`<div class="field"><div class="toggle ${tk.reviewed?'on':''}" id="revT"><div class="sw"><i></i></div><div class="tx">Revisado ✓<small>Confirmo que conferi a entrega</small></div></div></div>`:''}
    <div class="field"><label>Definição de pronto</label><textarea id="tDef" placeholder="Como saber que está pronto?">${esc(tk.defPronto||'')}</textarea></div>
    <div class="field"><label>Link da entrega</label><input id="tEnt" placeholder="Cole o link do resultado" value="${esc(tk.entrega||'')}">${tk.entrega?`<a href="${esc(tk.entrega)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;color:var(--gold-2);font-size:12.5px;font-weight:700">Abrir entrega ↗</a>`:''}</div>
    <div class="field"><label>Depende de quem?</label><select id="tDep"><option value="">— ninguém —</option>${USERS.map(u=>`<option value="${u.id}" ${u.id===tk.dep?'selected':''}>${u.name}</option>`).join('')}</select></div>
    <div class="field"><label>Descrição / anotações</label><textarea id="tDesc" placeholder="Detalhes da tarefa...">${esc(tk.desc||'')}</textarea></div>

    ${commentsHTML(tk)}

  sheet.querySelectorAll('#tSt [data-st]').forEach(b=>b.onclick=()=>{

    tk.status=ns;tk.doneAt=ns==='done'?todayISO():null;stampReview(tk);save();render();openTask(tk);
  });
  sheet.querySelector('#tOwner').onchange=e=>{tk.owner=e.target.value;save();render();openTask(tk)};
  sheet.querySelectorAll('#tPrio [data-p]').forEach(b=>b.onclick=()=>{tk.prio=b.dataset.p||null;save();render();openTask(tk)});
  const rt=sheet.querySelector('#revT');if(rt)rt.onclick=()=>{tk.reviewed=!tk.reviewed;save();openTask(tk)};

    <div class="field"><label>Concluídas hoje</label>
      <div style="font-size:13.5px;color:var(--soft)">${doneToday.length?doneToday.map(x=>'• '+esc(x.title)).join('<br>'):'Nada marcado como feito ainda hoje.'}</div></div>
    <div class="field"><label>Algo travou? (opcional)</label><textarea id="ciB" placeholder="Ex.: Esperando a Simoni gravar os CPLs pra montar a página."></textarea></div>
    <button class="primary" id="ciSave">Enviar check-in</button>`);
  sheet.querySelector('#ciSave').onclick=()=>{
    const b=sheet.querySelector('#ciB').value.trim();
    S.checkins=S.checkins.filter(c=>!(c.user===S.current&&c.date===todayISO()));
    S.checkins.push({user:S.current,date:todayISO(),blocked:b,done:doneToday.map(x=>x.id)});
    save();closeSheet();
    openSheet(`<div style="text-align:center;padding:14px 0 4px"><div style="font-size:42px">🎉</div>
      <h3 style="margin-top:8px">Check-in enviado!</h3><p class="sub">Valeu, ${u.name}. A Simoni já consegue ver no Painel.</p>
      <button class="primary" id="okok">Beleza</button></div>`);
    sheet.querySelector('#okok').onclick=closeSheet;
  };
}

/* ---- VENDAS (CRM) ---- */
function leadDue(d){
  if(!d)return null;const to=todayISO();
  const diff=Math.round((new Date(d)-new Date(to))/864e5);
  if(diff<0)return {t:Math.abs(diff)+'d atrás',over:true};
  if(diff===0)return {t:'hoje',over:true};
  if(diff===1)return {t:'amanhã',over:false};
  const dd=new Date(d);return {t:dd.getDate()+'/'+(dd.getMonth()+1),over:false};
}
function leadCard(ld,showNext){
  const st=stageById(ld.stage);
  const c=el('div','kcard');
  let chips=`<span class="chip" style="background:${st.c}22;color:${st.c}">${st.l}</span>`;
  chips+=`<span class="chip who-c"><span class="dot" style="background:#5AA6C9"></span>${esc(ld.source)}</span>`;
  if(ld.plano&&ld.plano!=='—')chips+=`<span class="chip cat-comercial">${esc(ld.plano)}</span>`;
  const nd=leadDue(ld.next);
  if(nd&&!isTerminal(ld.stage))chips+=`<span class="chip due ${nd.over?'over':''}">📞 ${nd.t}</span>`;
  const body=el('div','',`<div class="tk-title">${esc(ld.name)}</div><div class="tk-meta">${chips}</div>`);
  body.onclick=()=>openLead(ld);
  c.appendChild(body);
  if(showNext){
    const act=el('div','kc-act');
    const done=el('button','mini go','Falei ✓');
    done.onclick=()=>{ld.last=todayISO();ld.next=null;const ord=advanceOrder();const i=ord.indexOf(ld.stage);if(i>=0&&i<ord.length-1)ld.stage=ord[i+1];save();render()};
    act.appendChild(done);
    const op=el('button','mini','Abrir');op.onclick=()=>openLead(ld);act.appendChild(op);
    c.appendChild(act);
  }
  enableCardDrag(c,'lead',ld);return c;
}
const VSUBS=[['geral','Visão geral'],['pipeline','Pipeline'],['documentos','Documentos']];
function vVendas(v){
  v.appendChild(el('div','pagehead',`<div class="k">Comercial · CRM</div><h2>Vendas</h2>
    <p>Visão geral, pipeline e documentos do comercial.</p>`));
  const sub=S.vendaSub||'geral';
  const bar=el('div','subtabs');
  VSUBS.forEach(([id,lab])=>{const b=el('button','subtab'+(sub===id?' on':''),lab);b.onclick=()=>{S.vendaSub=id;save();render()};bar.appendChild(b)});
  v.appendChild(bar);
  ({geral:vVendaGeral,pipeline:vVendaPipeline,documentos:vVendaDocs}[sub]||vVendaGeral)(v);
}
function vVendaGeral(v){
  v.appendChild(el('div','note','⏱️ <b>Regra de ouro:</b> todo lead é PAGO (custou tráfego + tempo do time). Responda rápido — meta: até <b>1h</b> no horário comercial. Nunca deixe "pra depois" achando que vai incomodar: se o lead chegou, é porque quer.'));
  const active=S.leads.filter(x=>!isTerminal(x.stage));
  const alunos=S.leads.filter(x=>isWon(x.stage)).length;
  const firstStage=(S.stages[0]||{}).id;
  const negoc=active.filter(x=>x.stage!==firstStage).length;
  const conv=S.leads.length?Math.round(alunos/S.leads.length*100):0;
  v.appendChild(el('div','pcard big',`
    <div class="lab">Pipeline</div>
    <div class="big-n">${active.length}</div>
    <div style="color:var(--soft);font-size:13px;margin-top:2px">leads ativos no funil</div>
    <div class="pgrid">
      <div class="b"><div class="n">${negoc}</div><div class="l">em negociação</div></div>
      <div class="b"><div class="n">${alunos}</div><div class="l">viraram aluno</div></div>
      <div class="b"><div class="n">${conv}%</div><div class="l">conversão</div></div>
    </div>`));
  const due=S.leads.filter(x=>x.next&&x.next<=todayISO()&&!isTerminal(x.stage)).sort((a,b)=>a.next<b.next?-1:1);
  v.appendChild(seclab('📞 Falar hoje · '+due.length));
  if(due.length)due.forEach(ld=>v.appendChild(leadCard(ld,true)));
  else v.appendChild(el('div','',`<div style="color:var(--faint);font-size:13px;padding:0 4px 8px">Nenhum follow-up marcado pra hoje. 👏</div>`));
}
function vVendaPipeline(v){
  v.appendChild(el('div','note pipehint',`Arraste o lead pela jornada de vendas da Nati — segure e arraste o card pra coluna que quiser.`));
  const tools=el('div','pipetools');
  const editBtn=el('button','editstages','⚙️ Editar etapas — renomear · reordenar · adicionar');
  editBtn.onclick=openStageEditor;tools.appendChild(editBtn);
  v.appendChild(tools);
  const board=el('div','kboard pipe');
  S.stages.forEach(s=>{
    const st=s.id;
    const items=S.leads.filter(x=>x.stage===st);
    const c=el('div','kcol');c.dataset.drop=st;
    c.appendChild(el('div','kcol-h',`<span class="pip" style="background:${s.c}"></span>${esc(s.l)}<span class="cnt">${items.length}</span>`));
    if(!items.length)c.appendChild(el('div','kc-empty','—'));
    items.forEach(ld=>c.appendChild(leadCard(ld,false)));
    board.appendChild(c);
  });
  v.appendChild(board);
}
/* editor de etapas (renomear / reordenar / cor / adicionar / remover) */
const STAGE_COLORS=['#9E998D','#5AA6C9','#E2A33C','#C9A24B','#B98BD6','#46B07C','#D9594C','#E07A8A'];
function openStageEditor(){drawStageEditor()}
function drawStageEditor(){
  const rows=S.stages.map((s,i)=>`<div class="strow">
    <input class="sl" data-i="${i}" value="${esc(s.l)}">
    <div class="scolors" data-i="${i}">${STAGE_COLORS.map(c=>`<button class="sc${s.c===c?' on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div>
    <button class="smv sup" data-i="${i}" title="Subir">↑</button>
    <button class="smv sdn" data-i="${i}" title="Descer">↓</button>
    <button class="smv sdel" data-i="${i}" title="Remover">✕</button>
  </div>`).join('');
  openSheet(`<h3>Editar etapas do funil</h3>
    <div class="sub">Renomeie, mude a cor, reordene (↑ ↓) ou remova. O time mexe à vontade — não precisa de mim.</div>
    <div class="stageedit">${rows}</div>
    <button class="addfield" id="addStage">+ adicionar etapa</button>
    <button class="primary" id="stClose" style="margin-top:8px">Pronto</button>`);
  sheet.querySelectorAll('.sl').forEach(inp=>inp.onchange=()=>{S.stages[+inp.dataset.i].l=inp.value;save()});
  sheet.querySelectorAll('.scolors .sc').forEach(b=>b.onclick=()=>{S.stages[+b.closest('.scolors').dataset.i].c=b.dataset.c;save();drawStageEditor()});
  sheet.querySelectorAll('.sup').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,a=S.stages;if(i>0){const t=a[i-1];a[i-1]=a[i];a[i]=t;save();drawStageEditor()}});
  sheet.querySelectorAll('.sdn').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,a=S.stages;if(i<a.length-1){const t=a[i+1];a[i+1]=a[i];a[i]=t;save();drawStageEditor()}});
  sheet.querySelectorAll('.sdel').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,s=S.stages[i];
    if(S.stages.length<=2){alert('Precisa de pelo menos 2 etapas.');return}
    const cnt=S.leads.filter(x=>x.stage===s.id).length;
    if(cnt&&!confirm(`Tem ${cnt} lead(s) nessa etapa. Eles vão pra "${S.stages[0].l}". Remover mesmo?`))return;
    S.leads.forEach(x=>{if(x.stage===s.id)x.stage=S.stages[0].id});
    S.stages.splice(i,1);save();drawStageEditor();
  });
  sheet.querySelector('#addStage').onclick=()=>{
    let idx=S.stages.findIndex(s=>s.won||s.lost);if(idx<0)idx=S.stages.length;
    S.stages.splice(idx,0,{id:'st'+Date.now(),l:'Nova etapa',c:'#5AA6C9'});
    save();drawStageEditor();
  };
  sheet.querySelector('#stClose').onclick=()=>{closeSheet();render()};
}
function vVendaDocs(v){
  const docs=[
    {t:'Scripts · Árvore de Atendimento / Objeções',d:'Respostas-padrão pra inbox, objeções e argumentos de venda.',u:'https://docs.google.com/spreadsheets/d/1i4SokWd22p4Jpwta4KZPYbZw5RZk-ApWBce8W9kLzu4/edit'},
    {t:'Roteiro de vendas (1º contato → fechamento)',d:'O passo a passo da abordagem ativa da Nati.',u:''},
    {t:'Quadro de Comunicações',d:'Acessos, canais de atendimento e prioridades.',u:''},
    {t:'Links de pagamento (US$ 597 a 1.297)',d:'Links de checkout por faixa de plano (Stripe).',u:''},
  ];
  v.appendChild(seclab('Documentos do comercial'));
  docs.forEach(dc=>{
    const a=el('a','doc');a.href=dc.u||'#';if(dc.u){a.target='_blank';a.rel='noopener'}

}
function vPosVenda(v){
  v.appendChild(el('div','pagehead',`<div class="k">Pós-compra</div><h2>Pós-venda</h2>
    <p>O que acontece depois que o lead vira aluno — onboarding, renovação e acessos.</p>`));
  const blocks=[
    {h:'Onboarding do aluno',li:['Enviar boas-vindas + acesso à Curseduca','Conferir acesso (app, suporte)','Apresentar o "Comece por aqui, aluno!"']},
    {h:'Anuidade & renovação',li:['Conferir vencimentos toda semana','Seguir o script de retenção','Esclarecer upgrade VRD → Premium']},
    {h:'Acessos & prêmios',li:['Alunos NRD, bônus e anuidade estendida (2 anos)','Ganhadores de prêmios','Conferir migração de acessos']},
  ];
  blocks.forEach(b=>{
    const c=el('div','infocard');
    c.innerHTML=`<h4>${esc(b.h)}</h4><ul>${b.li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    v.appendChild(c);
  });
  const alunos=S.leads.filter(x=>isWon(x.stage));
  v.appendChild(seclab('Alunos recentes · '+alunos.length));
  if(!alunos.length)v.appendChild(el('div','',`<div style="color:var(--faint);font-size:13px;padding:0 4px 6px">Quando um lead virar aluno no pipeline, ele aparece aqui.</div>`));
  alunos.forEach(a=>{
    const c=el('div','pcard');
    c.innerHTML=`<div class="prow"><span class="av" style="background:#46B07C">${esc(a.name[0])}</span>
      <div><div class="pn">${esc(a.name)}</div><div class="pr">${esc(a.source)}</div></div>
      <div class="stat"><div class="s1">${esc(a.plano)}</div><div class="s2">aluno</div></div></div>`;
    v.appendChild(c);
  });
  v.appendChild(el('div','note',`Essa área vai crescer — me fala que infos de pós-venda você quer aqui (NPS, renovações, histórico do aluno...).`));
}
function openLead(ld){
  openSheet(`<h3>${esc(ld.name)}</h3>
    <div class="sub">${esc(ld.contact||'sem contato')} · origem: ${esc(ld.source)}</div>
    <div class="field"><label>Etapa do funil</label><div class="seg" id="lSt">${S.stages.map(s=>`<button data-s="${s.id}" class="${ld.stage===s.id?'on':''}">${esc(s.l)}</button>`).join('')}</div></div>
    <div class="field"><label>Próximo contato</label><input id="lNext" type="date" value="${ld.next||''}"></div>
    <div class="field"><label>Plano de interesse</label><div class="seg" id="lPl">${PLANOS.map(p=>`<button data-p="${p}" class="${ld.plano===p?'on':''}">${p}</button>`).join('')}</div></div>
    <div class="field"><label>Anotações</label><textarea id="lNote">${esc(ld.note)}</textarea></div>
    ${camposHTML(ld)}
    ${commentsHTML(ld)}
    <button class="primary" id="lSave">Salvar</button>
    <button class="danger" id="lDel" style="margin-top:8px">Excluir lead</button>`);
  let stage=ld.stage,plano=ld.plano;
  sheet.querySelectorAll('#lSt [data-s]').forEach(b=>b.onclick=()=>{stage=b.dataset.s;sheet.querySelectorAll('#lSt [data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===stage))});
  sheet.querySelectorAll('#lPl [data-p]').forEach(b=>b.onclick=()=>{plano=b.dataset.p;sheet.querySelectorAll('#lPl [data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===plano))});
  sheet.querySelector('#lSave').onclick=()=>{ld.stage=stage;ld.plano=plano;ld.next=sheet.querySelector('#lNext').value||null;ld.note=sheet.querySelector('#lNote').value;if(isTerminal(stage))ld.next=null;save();closeSheet();render()};
  sheet.querySelector('#lDel').onclick=()=>{S.leads=S.leads.filter(x=>x.id!==ld.id);save();closeSheet();render()};
  wireCC(ld,()=>{ld.note=sheet.querySelector('#lNote').value;ld.stage=stage;ld.plano=plano;ld.next=sheet.querySelector('#lNext').value||ld.next;openLead(ld)});
}
let ldraft;
function openNewLead(){ldraft={name:'',contact:'',source:'Lista de espera',next:todayISO(),note:''};drawNewLead()}
function drawNewLead(){
  openSheet(`<h3>Novo lead</h3>
    <div class="field"><label>Nome</label><input id="nlName" placeholder="Nome do lead" value="${esc(ldraft.name)}"></div>
    <div class="field"><label>Contato (WhatsApp ou e-mail)</label><input id="nlC" placeholder="+55 11 9... ou email" value="${esc(ldraft.contact)}"></div>
    <div class="field"><label>Origem</label><div class="seg" id="nlSrc">${SOURCES.map(s=>`<button data-s="${s}" class="${ldraft.source===s?'on':''}">${s}</button>`).join('')}</div></div>
    <div class="field"><label>Próximo contato</label><input id="nlNext" type="date" value="${ldraft.next}"></div>
    <div class="field"><label>Anotações</label><textarea id="nlNote" placeholder="De onde veio, o que conversaram...">${esc(ldraft.note)}</textarea></div>
    <button class="primary" id="nlSave">Adicionar ao funil</button>`);
  sheet.querySelector('#nlName').oninput=e=>ldraft.name=e.target.value;
  sheet.querySelector('#nlC').oninput=e=>ldraft.contact=e.target.value;
  sheet.querySelector('#nlNext').onchange=e=>ldraft.next=e.target.value;
  sheet.querySelector('#nlNote').oninput=e=>ldraft.note=e.target.value;
  sheet.querySelectorAll('#nlSrc [data-s]').forEach(b=>b.onclick=()=>{ldraft.source=b.dataset.s;sheet.querySelectorAll('#nlSrc [data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s===ldraft.source))});
  sheet.querySelector('#nlSave').onclick=()=>{
    if(!ldraft.name.trim()){alert('Coloca o nome do lead 🙂');return}
    S.leads.unshift({id:'l'+Date.now(),name:ldraft.name.trim(),contact:ldraft.contact.trim(),source:ldraft.source,stage:'novo',plano:'—',last:null,next:ldraft.next||null,note:ldraft.note,owner:'nati',comments:[],campos:[]});
    save();closeSheet();render();
  };
}

render();
